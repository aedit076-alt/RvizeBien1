<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RevizeBien</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="programmes.js"></script>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0F2A43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RevizeBien">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--card:#fff;--ink:#0F2A43;--mute:#5B6E82;--line:#D9E2EC;--acc:#E8750F;--accink:#fff;--ok:#1E8E5A;--warn:#B7791F;--bad:#C93B3B;--hero:#0F2A43;--hero2:#1F5283;--heroink:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1623;--card:#13263A;--ink:#EAF1F8;--mute:#93A7BC;--line:#233B54;--acc:#F59A3C;--accink:#1A1206;--ok:#4CC38A;--warn:#E0B24A;--bad:#F07575;--hero:#13304F;--hero2:#24598C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1623;--card:#13263A;--ink:#EAF1F8;--mute:#93A7BC;--line:#233B54;--acc:#F59A3C;--accink:#1A1206;--ok:#4CC38A;--warn:#E0B24A;--bad:#F07575;--hero:#13304F;--hero2:#24598C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:24px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{background:linear-gradient(145deg,var(--hero),var(--hero2));color:var(--heroink);border-radius:20px;padding:22px}
.hero small{opacity:.85;font-size:14px}
.hero .big{font-size:60px;font-weight:800;line-height:1;margin:8px 0;letter-spacing:-.02em}
.hero .sub{font-size:15px;opacity:.92}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row.now{border-color:var(--acc);border-width:2px}
.row.past{opacity:.5}
.row.next{border-left:5px solid var(--acc)}
.t{font-size:13px;color:var(--mute);min-width:98px}
.n{font-weight:600;flex:1}
.r{font-size:13px;color:var(--mute)}
.tag{font-size:12px;border-radius:20px;padding:2px 10px;font-weight:600;background:var(--acc);color:var(--accink);white-space:nowrap}
.tag.st0{background:var(--line);color:var(--mute)}.tag.st2{background:var(--ok);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
.ch{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ch.s1{border-left-color:var(--acc)}.ch.s2{border-left-color:var(--ok)}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.lb{border:1px solid var(--line);background:transparent;border-radius:10px;padding:9px 4px;font-size:14px}
.lb.l1.on{background:var(--ok);border-color:var(--ok);color:#fff}
.lb.l2.on{background:var(--warn);border-color:var(--warn);color:#fff}
.lb.l3.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn{border:0;background:var(--acc);color:var(--accink);border-radius:12px;padding:12px 18px;font-weight:600;margin-top:12px}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:10px;padding:9px 14px;font-weight:400;font-size:14px}
.timer{text-align:center}
.clock{font-size:84px;font-weight:800;letter-spacing:-.03em;margin:22px 0 4px;font-variant-numeric:tabular-nums}
.timer .btn{margin:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.st span{font-size:12px;color:var(--mute)}
.st.l1 b{color:var(--ok)}.st.l2 b{color:var(--warn)}.st.l3 b{color:var(--bad)}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bv{width:100%;min-height:3px;background:var(--acc);border-radius:6px 6px 2px 2px}
.bc small{color:var(--mute);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:90px;border:0;background:transparent;border-radius:12px;padding:9px 2px;font-size:12px;color:var(--mute)}
nav button.on{background:var(--acc);color:var(--accink);font-weight:600}
.av{font-weight:800;font-size:18px}.av.ok{color:var(--ok)}.av.warn{color:var(--warn)}.av.bad{color:var(--bad)}
.gr{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;font-size:13px;margin:4px 6px 0 0}
.gr button{border:0;background:transparent;color:var(--mute);font-size:18px;line-height:1;padding:2px 6px}
.coef{width:64px;font:inherit;font-size:15px;padding:4px 8px;margin-left:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.frm select,.frm input,.frm-s{font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.frm .btn{grid-column:1/-1;margin-top:0}
.erow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;align-items:center}
.erow.e2{grid-template-columns:1fr 1fr 44px}
.erow select,.erow input{font:inherit;font-size:15px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
.erow .w2{grid-column:span 2}
.erow button{border:1px solid var(--line);background:transparent;border-radius:10px;font-size:20px;color:var(--mute);height:100%;min-height:40px}
.up{display:block;text-align:center;cursor:pointer}
.pv{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:10px}
.pv img{width:180%;max-width:none;display:block}
.hint{font-size:14px;color:var(--mute);margin:8px 0 0}

#onb{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 28px}
#onb[hidden]{display:none}
.ob{max-width:520px;margin:0 auto}.logo{width:52px;height:52px;border-radius:14px;display:block}
.ob h1{font-size:28px;line-height:1.1;margin:16px 0 6px;font-weight:800}.ob h1 span{color:var(--acc);display:block}
.ob p{color:var(--mute);margin:0;font-size:14px}.ob label{display:block;font-weight:600;font-size:14px;margin:22px 0 8px}
.ob h3{font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cg.c2{grid-template-columns:repeat(2,1fr)}.cg.c3{grid-template-columns:repeat(3,1fr)}
.cl{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 4px;font-weight:600;font-size:14px}
.cl.on{background:var(--hero);color:#fff;border-color:var(--hero)}
.ob input{font:inherit;width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.ob .btn{width:100%;margin-top:22px;padding:14px}.ob .btn:disabled{opacity:.45}.ob .btn.g{margin-top:10px}
.hi{display:flex;gap:10px;align-items:center;margin-bottom:14px}.hi img{width:36px;height:36px;border-radius:10px}.hi div{flex:1;line-height:1.2}.hi small{display:block;color:var(--mute);font-size:13px}.hi .chip{font-size:13px;padding:6px 12px}
.empty{border:2px dashed var(--acc);border-radius:14px;padding:16px;margin:12px 0}.empty b{font-size:17px}.empty p{color:var(--mute);font-size:14px;margin:4px 0 0}.empty .btn{margin-top:10px}
.foot{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--mute);margin:28px 0 0}
</style>
</head>
<body>
<div id="onb" hidden></div>
<main>
<section id="today" class="on"><div class="hi" id="hello"></div><div class="hero" id="hero"></div><h2 id="dayTitle"></h2><div id="dayList"></div><p class="foot">REVIZEBIEN · BY STEPHEN</p></section>
<section id="revise"><div class="chips" id="chips"></div><div id="prog"></div><div id="items"></div></section>
<section id="pomo" class="timer"><h2>Je travaille sur</h2><div class="chips" id="subs"></div>
<div class="chips" style="justify-content:center;margin-top:10px"><button class="chip on" id="mWork">Travail 50 min</button><button class="chip" id="mBreak">Pause 10 min</button></div>
<div class="clock" id="clock">50:00</div>
<div><button class="btn" id="go">Démarrer</button><button class="btn g" id="rs">Remettre à zéro</button></div>
<p class="r" id="cnt"></p></section>
<section id="stats"></section>
<section id="notes"></section>
<section id="plan"></section>
</main>
<nav><button data-s="today" class="on">Accueil</button><button data-s="plan">Planning</button><button data-s="revise">Leçons</button><button data-s="pomo">Minuteur</button><button data-s="stats">Stats</button><button data-s="notes">Notes</button></nav>
<script>
let DV=[],W={};
const m=(h,mi)=>h*60+mi;
const JOURS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const LV=["","Facile","Moyen","Difficile"],ST=["À venir","En cours","Terminé"];
let S={};try{S=JSON.parse(localStorage.getItem("revizebien")||"{}")}catch(e){}
S.c=S.c||{};S.cl=S.cl||{};S.log=S.log||[];S.g=S.g||[];S.coef=S.coef||{};if(S.tt)W=S.tt;if(S.dv)DV=S.dv;let CH={},SUBS=[],NS=[],NS2=[],cur="";
const kp=()=>S.cls+"|",LBL=c=>(c||"").replace("Tle","Terminale"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setClass(c){S.cls=c;CH=PROG[c]||{};SUBS=SUBJECTS[c]||Object.keys(CH);NS=SUBS.concat(["EPS"]);NS2=NS.concat(["Informatique","Autre"]);cur=SUBS[0];if(SUBS.indexOf(S.sub)<0)S.sub=SUBS[0];save()}
const save=()=>{try{localStorage.setItem("revizebien",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const hm=x=>String(Math.floor(x/60)).padStart(2,"0")+"h"+String(x%60).padStart(2,"0");
const fmtD=s=>new Date(s+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dur=x=>x>=60?Math.floor(x/60)+" h "+String(x%60).padStart(2,"0"):x+" min";
const pl=(n,w)=>n+" "+w+(n>1?"s":"");
const get=k=>S.c[k]||{s:0,l:0};

function sugg(){const w=Object.keys(S.c).find(k=>k.indexOf(kp())==0&&S.c[k].l==3&&S.c[k].s>0);return w?w.split("|")[1]:SUBS[new Date().getDay()%SUBS.length]}
function today(){
 if(!S.cls)return;
 const now=new Date(),d=now.getDay(),mn=m(now.getHours(),now.getMinutes()),t=ymd(now);
 $("hello").innerHTML=`<img src="icon-192.png" alt=""><div><b>Salut ${esc(S.name)}</b><small>${LBL(S.cls)}</small></div><button class="chip" id="edit" type="button">Modifier</button>`;
 const nx=DV.find(v=>v[0]>=t);
 if(nx){const j=Math.round((new Date(nx[0]+"T12:00:00")-new Date(t+"T12:00:00"))/864e5);
  $("hero").innerHTML=`<small>Prochain devoir : ${nx[1]}</small><div class="big">${j==0?"Aujourd’hui":pl(j,"jour")}</div><div class="sub">${fmtD(nx[0])}</div>`;
 }else $("hero").innerHTML=`<small>Aucun devoir prévu</small><div class="big">Au calme</div><div class="sub">Ajoute tes dates de devoirs dans Planning pour lancer le compte à rebours.</div>`;
 const L=W[d]||[];let h="";
 if(!TT.length)h+=`<div class="empty"><b>Ajoute ton emploi du temps</b><p>Une seule fois, et l’appli sait quand tu as cours et quand réviser.</p><button class="btn" type="button" data-go="plan">Remplir mon emploi du temps</button></div>`;
 else{$("dayTitle").textContent=JOURS[d]+" : tes cours";
  L.forEach(c=>{const st=mn>=c[1]&&mn<c[2]?"now":mn>=c[2]?"past":"";
   h+=`<div class="row ${st}"><div class="t">${hm(c[1])} - ${hm(c[2])}</div><div class="n">${c[0]}</div>${st=="now"?'<span class="tag">En cours</span>':""}</div>`});
  if(!L.length)h+=`<div class="row"><div class="n">Pas de cours aujourd’hui</div></div>`}
 if(!TT.length)$("dayTitle").textContent="";
 h+=eveHTML(d);
 const weak=Object.keys(S.c).filter(k=>k.indexOf(kp())==0&&S.c[k].l==3&&S.c[k].s>0).slice(0,4);
 if(weak.length)h+=`<h2>À retravailler en priorité</h2>`+weak.map(k=>{const p=k.split("|");return `<div class="row"><div class="n">${p[2]}</div><div class="r">${p[1]}</div></div>`}).join("");
 $("dayList").innerHTML=h;
}
function devoirs(){}
function revise(){
 $("chips").innerHTML=SUBS.map(k=>`<button class="chip ${k==cur?"on":""}" data-k="${k}">${k}</button>`).join("");
 const it=(CH[cur]||[]).concat(S.cl[kp()+cur]||[]);let go=0,fin=0;
 it.forEach(c=>{const o=get(kp()+cur+"|"+c);if(o.s>0)go++;if(o.s==2)fin++});
 $("prog").innerHTML=`<h2>${cur}, ${LBL(S.cls)} : ${fin} terminé${fin>1?"s":""} sur ${it.length}</h2><div class="bar"><i style="width:${it.length?fin/it.length*100:0}%"></i></div><h2>Appuie sur « Commencer » quand vous attaquez une leçon en classe.</h2>`;
 $("items").innerHTML=it.map(c=>{const k=kp()+cur+"|"+c,o=get(k);
  const body=o.s==0?`<button class="btn" data-a="go" data-k="${k}">Commencer cette leçon</button>`
   :`<div class="lv">${[1,2,3].map(n=>`<button class="lb l${n} ${o.l==n?"on":""}" data-a="lv" data-n="${n}" data-k="${k}">${LV[n]}</button>`).join("")}</div>`
   +(o.s==1?`<button class="btn g" data-a="done" data-k="${k}">Marquer terminé</button>`:`<button class="btn g" data-a="go" data-k="${k}">Rouvrir</button>`);
  return `<div class="ch s${o.s}"><div class="top"><div class="n">${c}</div><span class="tag st${o.s}">${ST[o.s]}</span></div>${body}</div>`}).join("")+(it.length?"":`<p class="hint">Le programme de ${LBL(S.cls)} pour cette matière arrive bientôt. Ajoute tes propres leçons ci-dessous.</p>`)+`<div class="frm" style="margin-top:12px"><input id="nl" placeholder="Ajouter une leçon" aria-label="Nouvelle leçon"><button class="btn" data-a="addl" type="button">Ajouter</button></div>`;
}
$("chips").onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;revise()}};
$("items").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;
 if(b.dataset.a=="addl"){const v=$("nl").value.trim();if(v){const q=kp()+cur;(S.cl[q]=S.cl[q]||[]).push(v);save();revise()}return}
 const k=b.dataset.k,a=b.dataset.a,o=get(k);
 if(a=="go")o.s=1;else if(a=="done")o.s=2;else if(a=="lv"){const n=+b.dataset.n;o.l=o.l==n?0:n}
 S.c[k]=o;save();revise();today();stats()};

const subs=()=>{$("subs").innerHTML=SUBS.map(k=>`<button class="chip ${k==S.sub?"on":""}" data-k="${k}">${k}</button>`).join("")};
$("subs").onclick=e=>{const k=e.target.dataset.k;if(k){S.sub=k;save();subs()}};
let mode=50,left=50*60,end=null,iv=null;
const clk=()=>{const s=Math.max(0,Math.round(left));$("clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const cnt=()=>{const n=S.log.filter(x=>x[0]==ymd(new Date())).length;$("cnt").textContent=n?pl(n,"session")+" de travail aujourd’hui":"Téléphone éloigné pendant la session."};
function setMode(x){mode=x;left=x*60;stop();$("mWork").classList.toggle("on",x==50);$("mBreak").classList.toggle("on",x==10);clk()}
function stop(){clearInterval(iv);iv=null;end=null;$("go").textContent="Démarrer"}
$("go").onclick=()=>{if(iv){left=(end-Date.now())/1000;stop();$("go").textContent="Reprendre";return}
 end=Date.now()+left*1000;$("go").textContent="Pause";
 iv=setInterval(()=>{left=(end-Date.now())/1000;clk();if(left<=0){stop();if(mode==50){S.log.push([ymd(new Date()),50,S.sub]);save();stats()}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}cnt();setMode(mode==50?10:50)}},250)};
$("rs").onclick=()=>setMode(mode);
$("mWork").onclick=()=>setMode(50);$("mBreak").onclick=()=>setMode(10);

function stats(){
 const now=new Date(),t=ymd(now),L=S.log,by={},sj={};
 L.forEach(x=>{by[x[0]]=(by[x[0]]||0)+x[1];sj[x[2]]=(sj[x[2]]||0)+x[1]});
 const days=[];for(let i=6;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push([ymd(d),d])}
 const wk=days.reduce((a,x)=>a+(by[x[0]]||0),0),mx=Math.max(50,...days.map(x=>by[x[0]]||0));
 const bars=days.map(x=>{const v=by[x[0]]||0;return `<div class="bc"><div class="bv" style="height:${Math.round(v/mx*100)}%"></div><small>${"DLMMJVS"[x[1].getDay()]}</small></div>`}).join("");
 const sl=Object.keys(sj).sort((a,b)=>sj[b]-sj[a]),lv=[0,0,0,0];
 Object.keys(S.c).forEach(k=>{const o=S.c[k];if(k.indexOf(kp())==0&&o.s>0)lv[o.l||0]++});
 $("stats").innerHTML=`<div class="grid"><div class="st"><b>${dur(by[t]||0)}</b><span>aujourd’hui</span></div><div class="st"><b>${dur(wk)}</b><span>7 derniers jours</span></div><div class="st"><b>${L.length}</b><span>sessions en tout</span></div></div>`
  +`<h2>Temps de travail par jour</h2><div class="bars">${bars}</div><h2>Par matière</h2>`
  +(sl.length?sl.map(s=>`<div class="row"><div class="n">${s}</div><div class="r">${dur(sj[s])}</div></div>`).join(""):`<div class="row"><div class="n">Aucune session pour l’instant. Lance le minuteur.</div></div>`)
  +`<h2>Maîtrise des leçons commencées</h2><div class="grid"><div class="st l1"><b>${lv[1]}</b><span>faciles</span></div><div class="st l2"><b>${lv[2]}</b><span>moyens</span></div><div class="st l3"><b>${lv[3]}</b><span>difficiles</span></div></div>`;
}
const CF={"Maths":4,"Physique-Chimie":4,"SVT":4,"Philosophie":2,"Français":2,"Anglais":2,"Hist-Géo":2,"EPS":1};
const coef=s=>S.coef[s]!=null?S.coef[s]:(CF[s]||2);
const f2=n=>n.toFixed(2).replace(".",",");
const mean=a=>a.reduce((p,x)=>p+x.v,0)/a.length;
function avg(s,t){const L=S.g.filter(x=>x.s==s&&x.t==t);if(!L.length)return null;
 if(S.mode=="all")return mean(L);
 const I=L.filter(x=>x.ty=="I"),D=L.filter(x=>x.ty=="D");
 return I.length&&D.length?(mean(I)+mean(D))/2:mean(I.length?I:D)}
function notes(){
 const t=S.pt||1;let num=0,den=0,nb=0;
 const cards=NS.map(s=>{const a=avg(s,t),c=coef(s);if(a!==null){num+=a*c;den+=c;nb++}
  const L=S.g.filter(x=>x.s==s&&x.t==t),cl=a===null?"":a>=10?"ok":a>=8?"warn":"bad";
  const gr=L.map(x=>`<span class="gr">${x.ty=="I"?"Interro":"Devoir"} ${f2(x.v)}<button data-del="${x.id}" aria-label="Supprimer cette note">×</button></span>`).join("")||`<span class="r">Aucune note</span>`;
  return `<div class="ch"><div class="top"><div class="n">${s}</div><span class="av ${cl}">${a===null?"-":f2(a)}</span></div><div class="r" style="margin:6px 0 4px">Coefficient<input class="coef" type="number" min="0" max="10" step="0.5" value="${c}" data-coef="${s}"></div><div>${gr}</div></div>`}).join("");
 const g=den?num/den:null;
 $("notes").innerHTML=`<div class="chips">${[1,2,3].map(n=>`<button class="chip ${n==t?"on":""}" data-pt="${n}">Trimestre ${n}</button>`).join("")}</div>`
 +`<div class="hero" style="margin-top:10px"><small>Moyenne générale, trimestre ${t}</small><div class="big">${g===null?"-":f2(g)}</div><div class="sub">${g===null?"Ajoute une première note pour la calculer.":"sur 20, "+pl(nb,"matière")+" comptée"+(nb>1?"s":"")}</div></div>`
 +`<h2>Ajouter une note</h2><div class="frm"><select id="gS" aria-label="Matière">${NS.map(s=>`<option ${s==S.ls?"selected":""}>${s}</option>`).join("")}</select><select id="gT" aria-label="Type"><option value="I" ${S.lt!="D"?"selected":""}>Interrogation</option><option value="D" ${S.lt=="D"?"selected":""}>Devoir</option></select><input id="gV" type="number" inputmode="decimal" min="0" max="20" step="0.25" placeholder="Note sur 20" aria-label="Note sur 20"><button class="btn" id="gAdd" type="button">Ajouter la note</button></div>`
 +`<h2>Par matière</h2>${cards}`
 +`<h2>Calcul de la moyenne d’une matière</h2><select id="gM" class="frm-s"><option value="ty" ${S.mode!="all"?"selected":""}>Moyenne des interrogations et moyenne des devoirs à parts égales</option><option value="all" ${S.mode=="all"?"selected":""}>Toutes les notes comptent pareil</option></select>`;
}
$("notes").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.pt){S.pt=+b.dataset.pt;save();notes();return}
 if(b.dataset.del){S.g=S.g.filter(x=>String(x.id)!==b.dataset.del);save();notes();return}
 if(b.id=="gAdd"){const v=parseFloat($("gV").value.replace(",","."));
  if(isNaN(v)||v<0||v>20){$("gV").focus();return}
  S.ls=$("gS").value;S.lt=$("gT").value;
  S.g.push({id:Date.now(),s:S.ls,ty:S.lt,v:v,t:S.pt||1});save();notes()}};
$("notes").onchange=e=>{const el=e.target;
 if(el.dataset.coef){const c=parseFloat(el.value);S.coef[el.dataset.coef]=isNaN(c)||c<0?CF[el.dataset.coef]:c;save();notes()}
 else if(el.id=="gM"){S.mode=el.value;save();notes()}};
/* ===== Planning : photo, lecture du texte, génération ===== */
const DAYN=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const KEYS=[["math","Maths"],["physique","Physique-Chimie"],["pc","Physique-Chimie"],["svt","SVT"],["philo","Philosophie"],["franc","Français"],["angl","Anglais"],["hist","Hist-Géo"],["geo","Hist-Géo"],["eps","EPS"],["sport","EPS"],["info","Informatique"],["edhc","EDHC"]];
function subjOf(t){const n=norm(t);for(const k of KEYS){if(new RegExp("\\b"+k[0]).test(n))return k[1]}return null}
const hhmm=x=>String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
const toMin=v=>{const p=(v||"0:0").split(":");return (+p[0])*60+(+p[1]||0)};
const MO={janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12};
let TT=[],DL=[];
Object.keys(W).forEach(d=>W[d].forEach(c=>TT.push({d:+d,a:c[1],b:c[2],s:c[0]})));
TT.sort((x,y)=>(x.d||7)-(y.d||7)||x.a-y.a);
DL=DV.map(x=>({date:x[0],s:x[1]}));
const PH={tt:null,dv:null},URLS={tt:null,dv:null},MSG={tt:"",dv:""};
function saveTT(){W={};TT.forEach(x=>{(W[x.d]=W[x.d]||[]).push([x.s,x.a,x.b,""])});Object.keys(W).forEach(d=>W[d].sort((p,q)=>p[1]-q[1]));S.tt=W;save();today()}
function saveDV(){DV=DL.filter(x=>x.date).map(x=>[x.date,x.s]).sort((a,b)=>a[0]<b[0]?-1:1);S.dv=DV;save();today();devoirs()}
function parseTT(text){let day=1;const out=[];
 const TR=/(\d{1,2})\s*[h:H]\s*(\d{2})?\s*(?:-|–|—|à)\s*(\d{1,2})\s*[h:H]\s*(\d{2})?/;
 text.split("\n").forEach(line=>{const n=norm(line);
  ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"].forEach((d,i)=>{if(n.indexOf(d)>=0)day=i});
  const m=line.match(TR),s=subjOf(line);
  if(m&&s){const a=(+m[1])*60+(+m[2]||0),b=(+m[3])*60+(+m[4]||0);if(b>a&&b<=1440)out.push({d:day,a:a,b:b,s:s})}});
 return out}
function parseDV(text){const out=[],now=new Date();
 text.split("\n").forEach(line=>{const n=norm(line);let d=null,m;
  if((m=n.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})(?:\s*[\/.\-]\s*(\d{2,4}))?/)))d=[+m[3]||0,+m[2],+m[1]];
  else if((m=n.match(/(\d{1,2})\s*(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre)/)))d=[0,MO[m[2]],+m[1]];
  const s=subjOf(line);
  if(d&&s&&d[1]>=1&&d[1]<=12&&d[2]>=1&&d[2]<=31){let y=d[0];if(y&&y<100)y+=2000;
   if(!y){y=now.getFullYear();if(new Date(y,d[1]-1,d[2])<new Date(now.getTime()-30*864e5))y++}
   out.push({date:y+"-"+String(d[1]).padStart(2,"0")+"-"+String(d[2]).padStart(2,"0"),s:s})}});
 return out}
function loadJs(u){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function prep(f){const bmp=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
 const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 const x=c.getContext("2d");try{x.filter="grayscale(1) contrast(1.4)"}catch(e){}x.drawImage(bmp,0,0,c.width,c.height);return c}
async function ocr(k){const f=PH[k];if(!f)return;
 const say=t=>{MSG[k]=t;const p=document.querySelector('[data-msg="'+k+'"]');if(p)p.textContent=t};
 try{
  say("Préparation de la photo…");
  const cv=await prep(f);
  if(!window.Tesseract){say("Chargement du lecteur de texte (internet nécessaire la première fois)…");await loadJs("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js")}
  const w=await Tesseract.createWorker("fra",1,{logger:m=>{if(m.status)say(m.status+(m.progress?" "+Math.round(m.progress*100)+" %":""))}});
  const r=await w.recognize(cv);await w.terminate();
  const found=k=="tt"?parseTT(r.data.text):parseDV(r.data.text);
  if(!found.length)say("Rien de reconnu avec certitude. Remplis la liste à la main en regardant ta photo.");
  else{if(k=="tt"){TT=TT.concat(found);saveTT()}else{DL=DL.concat(found);saveDV()}say(found.length+" ligne(s) ajoutée(s). Vérifie-les dans la liste.")}
  planUI();
 }catch(e){say("Lecture impossible ici (internet est nécessaire la première fois). Remplis la liste à la main.")}}
function chapFor(s){const ks=Object.keys(S.c).filter(k=>k.indexOf(kp()+s+"|")==0&&S.c[k].s>0);
 const w=ks.find(k=>S.c[k].l==3)||ks.find(k=>S.c[k].s==1)||ks[0];return w?w.split("|")[2]:""}
function wk(s){let n=0;Object.keys(S.c).forEach(k=>{if(k.indexOf(kp()+s+"|")==0&&S.c[k].l==3&&S.c[k].s>0)n++});return n}
function genPlan(){
 const c=Object.assign({soir:[1110,1230],sam:[540,720],dim:[900,1020]},S.cfg||{});
 const now=new Date(),nowM=now.getHours()*60+now.getMinutes(),slots=[];
 for(let i=0;i<7;i++){const dt=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),dw=dt.getDay(),
   w=dw==0?c.dim:dw==6?c.sam:c.soir,busy=W[dw]||[];
  for(let t=w[0];t+50<=w[1];t+=60){if(i==0&&t<nowM)continue;if(busy.some(x=>t<x[2]&&t+50>x[1]))continue;slots.push({dt:dt,a:t})}}
 const dv=DV.map(x=>({d:new Date(x[0]+"T07:30:00"),s:subjOf(x[1])||x[1]})).filter(x=>x.d>now&&(x.d-now)<14*864e5);
 const left={};dv.forEach(x=>{if(left[x.s]==null)left[x.s]=3+(wk(x.s)?2:0)+((CF[x.s]||0)>=4?1:0)});
 const pool=NS.filter(s=>s!="EPS").sort((a,b)=>wk(b)-wk(a));
 let last="",fi=0;const plan=[];
 slots.forEach(sl=>{let best=null,bs=0;
  dv.forEach(x=>{if(!left[x.s]||x.d<=sl.dt)return;const dd=(x.d-sl.dt)/864e5,sc=left[x.s]/(dd+1)-(x.s==last?0.3:0);if(sc>bs){bs=sc;best=x}});
  let s,why;
  if(best){s=best.s;left[s]--;why="Avant le devoir du "+fmtD(ymd(best.d))}
  else{s=pool[fi++%pool.length];if(s==last)s=pool[fi++%pool.length];why="Révision libre"}
  last=s;plan.push({date:ymd(sl.dt),a:sl.a,b:sl.a+50,s:s,ch:chapFor(s),why:why})});
 S.plan=plan;save();return plan}
function planHTML(){const P=S.plan||[];
 if(!P.length)return `<div class="row"><div class="n">Aucun planning pour l’instant.</div></div>`;
 let h="",cur="";
 P.forEach(p=>{if(p.date!=cur){cur=p.date;h+=`<h2>${fmtD(p.date)}</h2>`}
  h+=`<div class="row"><div class="t">${hm(p.a)} - ${hm(p.b)}</div><div class="n">${p.s}${p.ch?" : "+p.ch:""}</div><div class="r">${p.why}</div></div>`});
 return h}
function eveHTML(d){const t=ymd(new Date()),P=(S.plan||[]).filter(p=>p.date==t);
 if(P.length)return `<h2>Étude prévue aujourd’hui</h2>`+P.map(p=>`<div class="row next"><div class="t">${hm(p.a)} - ${hm(p.b)}</div><div class="n">${p.s}${p.ch?" : "+p.ch:""}</div></div>`).join("");
 return `<h2>Étude, 18h30 - 20h30</h2><div class="row next"><div class="n">${sugg()}</div></div><p class="hint">Pour un vrai planning, va dans Planning et appuie sur « Générer ».</p>`}
function planUI(){
 const c=Object.assign({soir:[1110,1230],sam:[540,720],dim:[900,1020]},S.cfg||{});
 const ed=(k,L)=>L.map((x,i)=>k=="tt"
  ?`<div class="erow"><select data-k="tt" data-i="${i}" data-f="d" aria-label="Jour">${DAYN.map((n,j)=>`<option value="${j}" ${j==x.d?"selected":""}>${n}</option>`).join("")}</select><input type="time" data-k="tt" data-i="${i}" data-f="a" value="${hhmm(x.a)}" aria-label="Début"><input type="time" data-k="tt" data-i="${i}" data-f="b" value="${hhmm(x.b)}" aria-label="Fin"><input list="subjs" class="w2" data-k="tt" data-i="${i}" data-f="s" value="${x.s}" aria-label="Matière"><button type="button" data-del="tt" data-i="${i}" aria-label="Supprimer">×</button></div>`
  :`<div class="erow e2"><input type="date" data-k="dv" data-i="${i}" data-f="date" value="${x.date}" aria-label="Date"><input list="subjs" data-k="dv" data-i="${i}" data-f="s" value="${x.s}" aria-label="Matière"><button type="button" data-del="dv" data-i="${i}" aria-label="Supprimer">×</button></div>`).join("");
 const ph=k=>`<label class="btn up">Prendre une photo<input type="file" accept="image/*" capture="environment" data-ph="${k}" hidden></label><label class="btn g up">Choisir une image de la galerie<input type="file" accept="image/*" data-ph="${k}" hidden></label>`
  +(URLS[k]?`<div class="pv"><img src="${URLS[k]}" alt="Ta photo"></div><button class="btn g" type="button" data-ocr="${k}">Lire le texte de la photo</button>`:"")
  +`<p class="hint" data-msg="${k}">${MSG[k]||""}</p>`;
 const cf=(k,l)=>`<div class="erow e2"><span class="r">${l}</span><input type="time" data-cfg="${k}" data-j="0" value="${hhmm(c[k][0])}"><input type="time" data-cfg="${k}" data-j="1" value="${hhmm(c[k][1])}"></div>`;
 $("plan").innerHTML=`<datalist id="subjs">${NS2.map(s=>`<option value="${s}">`).join("")}</datalist>`
  +`<h2>1. Mon emploi du temps</h2><p class="hint">Prends-le en photo (bien éclairé, de face) ou remplis-le à la main ci-dessous. Vérifie toujours les lignes lues.</p>`+ph("tt")+`<div style="margin-top:12px">${ed("tt",TT)}</div><button class="btn g" type="button" data-add="tt">Ajouter un cours</button> <button class="btn g" type="button" data-clear="tt">Tout effacer</button>`
  +`<h2>2. Mon programme de devoirs</h2>`+ph("dv")+`<div style="margin-top:12px">${ed("dv",DL)}</div><button class="btn g" type="button" data-add="dv">Ajouter un devoir</button> <button class="btn g" type="button" data-clear="dv">Tout effacer</button>`
  +`<h2>3. Mes heures d’étude</h2>${cf("soir","Lun - Ven")}${cf("sam","Samedi")}${cf("dim","Dimanche")}`
  +`<button class="btn" type="button" data-gen="1">Générer mon planning de travail</button><div id="planOut">${planHTML()}</div><button class="btn g" type="button" data-copy="1">Copier le planning</button>`}
$("plan").addEventListener("change",e=>{const el=e.target,d=el.dataset;
 if(d.ph){const f=el.files&&el.files[0];if(!f)return;PH[d.ph]=f;if(URLS[d.ph])URL.revokeObjectURL(URLS[d.ph]);URLS[d.ph]=URL.createObjectURL(f);MSG[d.ph]="Photo prête. Appuie sur « Lire le texte », ou remplis la liste à la main en la regardant.";planUI();return}
 if(d.k){const L=d.k=="tt"?TT:DL,x=L[+d.i];if(!x)return;
  x[d.f]=(d.f=="a"||d.f=="b")?toMin(el.value):d.f=="d"?+el.value:el.value;
  if(d.k=="tt")saveTT();else saveDV();return}
 if(d.cfg){S.cfg=Object.assign({soir:[1110,1230],sam:[540,720],dim:[900,1020]},S.cfg||{});S.cfg[d.cfg][+d.j]=toMin(el.value);save()}});
$("plan").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.ocr){ocr(d.ocr);return}
 if(d.del){(d.del=="tt"?TT:DL).splice(+d.i,1);d.del=="tt"?saveTT():saveDV();planUI();return}
 if(d.add){if(d.add=="tt")TT.push({d:1,a:480,b:530,s:"Maths"});else DL.push({date:ymd(new Date()),s:"Maths"});d.add=="tt"?saveTT():saveDV();planUI();return}
 if(d.clear){if(d.clear=="tt"){TT=[];saveTT()}else{DL=[];saveDV()}planUI();return}
 if(d.gen){genPlan();$("planOut").innerHTML=planHTML();today();return}
 if(d.copy){const P=S.plan||[];let cur="",out=[];P.forEach(p=>{if(p.date!=cur){cur=p.date;out.push("",fmtD(p.date))}out.push(hm(p.a)+"-"+hm(p.b)+" "+p.s+(p.ch?" : "+p.ch:"")+" ("+p.why+")")});
  try{navigator.clipboard.writeText(out.join("\n").trim()).then(()=>{b.textContent="Copié"},()=>{b.textContent="Copie impossible"})}catch(err){b.textContent="Copie impossible"}}});

function show(s){
 document.querySelectorAll("section").forEach(x=>x.classList.toggle("on",x.id==s));
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.s==s));
 if(s=="stats")stats();if(s=="today")today();if(s=="notes")notes();if(s=="plan")planUI();window.scrollTo(0,0)}
document.querySelector("nav").onclick=e=>{const s=e.target.dataset.s;if(s)show(s)};
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)show(g.dataset.go);if(e.target.id=="edit")onb(true)});
const GR=[["Collège",["6e","5e","4e","3e"],""],["Seconde",["2nde A","2nde C"],"c2"],["Première",["1re A","1re C","1re D"],"c3"],["Terminale",["Tle A","Tle C","Tle D"],"c3"]];
function onb(edit){const o=$("onb");let sel=S.cls||"";o.hidden=false;
 o.innerHTML=`<div class="ob"><img class="logo" src="icon-192.png" alt=""><h1>${edit?"Mon profil":"Bienvenue sur"}<span>RevizeBien</span></h1><p>${edit?"Change ton prénom ou ta classe.":"Dis-nous qui tu es, on prépare ton programme officiel."}</p><label for="nm">Ton prénom</label><input id="nm" placeholder="Ex. Awa" value="${esc(S.name||"")}" autocomplete="given-name"><label>Ta classe</label>`
  +GR.map(g=>`<h3>${g[0]}</h3><div class="cg ${g[2]}">${g[1].map(c=>`<button type="button" class="cl ${c==sel?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>`).join("")
  +`<button class="btn" id="ok" type="button">${edit?"Enregistrer":"C’est parti"}</button>`+(edit?`<button class="btn g" id="cx" type="button">Annuler</button><button class="btn g" id="rz" type="button">Effacer toutes mes données</button>`:"")+`</div>`;
 const ck=()=>{$("ok").disabled=!(sel&&$("nm").value.trim())};
 o.oninput=ck;
 o.onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.c){sel=b.dataset.c;o.querySelectorAll(".cl").forEach(x=>x.classList.toggle("on",x.dataset.c==sel));ck()}
  else if(b.id=="ok"){S.name=$("nm").value.trim();setClass(sel);o.hidden=true;boot();show("today")}
  else if(b.id=="cx")o.hidden=true;
  else if(b.id=="rz"&&confirm("Effacer toutes tes données sur cet appareil ?")){try{localStorage.removeItem("revizebien")}catch(x){}location.reload()}};
 ck()}
function boot(){today();revise();subs();clk();cnt();stats();notes();planUI()}
if(S.cls&&PROG!==undefined){setClass(S.cls);boot()}else onb(false);
setInterval(today,60000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
